experiment: 
  experiment_name: "method_comparison"
  description: "Comparing different kernel alignment methods on multiple datasets."

  seed: 42
  output_dir: "results/method_comparison/"
  save_results: true

# --------------------------------------------------
# DATASET
# --------------------------------------------------
dataset:
  dataset_names: ["checkerboard", "corners"]
  dataset_path: "data/"

  split: 0.5
  shuffle: true

  preprocessing:
    scaling: "standard"         # options: standard, minmax, none
    dimensionality_reduction: null   # options: pca, null
    pca_components: null

# --------------------------------------------------
# KERNEL CONFIG
# --------------------------------------------------
kernel:
  device: "default.qubit"
  interface: "jax"
  differentiation_method: "backprop"

  embedding_type: "quack_embedding"
  num_qubits: 4
  num_layers: 2
  data_reuploading: true
  trainable_parameters: true

  seed: 42
  noisy: false

# --------------------------------------------------
# TRAINING CONFIG
# --------------------------------------------------
training:
  epochs: 100
  batch_size: null
  optimizer: "adam"
  learning_rate: 0.01

# --------------------------------------------------
# ALIGNMENT METHODS
# --------------------------------------------------
alignment_methods:

  - method_name: "centroid_based_kta"
    enabled: true

    params:
      centroids: [2, 4, 6, 8, 10]
      matrix_approximation: ["regular"]
      landmark_points: [2]

      alpha: [0.01]     # damping
      epsilon: [0.05]

      lambda_co: [0.001]
      lambda_kao: [0.001]

      update_frequency: [5]   # centroid update every n epochs
      num_iterations: [20, 50, 100, 200, 500]

  - method_name: "full_kta"
    enabled: true

    params:
      matrix_approximation: ["regular"]
      landmark_points: [2]

      optimizer: ["adam"]
      learning_rate: [0.1]
      num_iterations: [20, 50, 100, 200, 500]

  - method_name: "random_kta"
    enabled: true

    params:
      random_samples: [2, 4, 6, 8, 10]
      matrix_approximation: ["regular"]
      landmark_points: [2]
      num_iterations: [20, 50, 100, 200, 500]

  - method_name: "greedy_kta"
    enabled: true

    params:
      greedy_samples: [2, 4, 6, 8, 10]
      matrix_approximation: ["nystrom"]
      landmark_points: [2, 4, 8, 16]

      num_iterations: [20, 50, 100, 200, 500]

# --------------------------------------------------
# EVALUATION
# --------------------------------------------------
evaluation:
  metrics:
    - train_accuracy
    - test_accuracy
    - f1_score_macro
    - precision_macro
    - recall_macro
    - alignment

  primary_metric: "f1_score_macro"
  track_history: true

# --------------------------------------------------
# EFFICIENCY TRACKING
# --------------------------------------------------
efficiency:
  track_time: true
  track_circuit_executions: true
  track_memory: false

# --------------------------------------------------
# LOGGING
# --------------------------------------------------
logging:
  verbose: true
  save_history: true
  save_models: false

  plots:
    - accuracy_vs_epoch
    - alignment_vs_epoch
    - loss_vs_epoch
    - accuracy_vs_circuits
    - confusion_matrix

# --------------------------------------------------
# ABLATION STUDIES
# --------------------------------------------------
ablation:
  run_centroid_gradient_variant: false
  run_partial_coordinate_updates: true
  run_analytical_centroid_variant: true

# --------------------------------------------------
# REPRODUCIBILITY
# --------------------------------------------------
reproducibility:
  deterministic: true
  save_config: true
  log_seed: true
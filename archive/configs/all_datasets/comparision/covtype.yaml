##Configurations for training the quntum kernel alignment 

ray_config:
  ray_local_mode:         False
  num_cpus:               10
  num_gpus:               1
  method:                 QuantumKernels
  ray_logging_path:       logs/covtype
  ray_num_trial_samples:  1
  type:                   train

## DataSet Configuration
dataset:
  name:              covtype
  file:              /Users/digvijaysinhajarekar/Study/CCKA-Clustered_Centroid_Kernel_Alignment/data/covtype.npy
  n_samples:         200
  noise:             0.5
  num_sectors:       3
  points_per_sector: 15
  grid_size:         4
  sampling_radius:   0.1
  training_size:     0.50
  testing_size:      0.50
  validation_size:   0.0

## Quantum Kernel Model Configuration
qkernel:
  device:           lightning.qubit
  n_qubits:         [10]
  trainable:        True
  input_scaling:    True
  data_reuploading: True
  ansatz:           ['embedding_paper', 'he']
  ansatz_layers:    [10]

## Model Training Agent Configuration
agent:
  optimizer:            ['gd']
  lr:                   [0.1]
  mclr:                 [0.01]
  cclr:                 [0.01]
  epochs:               [200]
  train_method:         ['ccka']
  target_accuracy:      0.95
  get_alignment_every:  100
  validate_every_epoch: 1
  base_path:            /home/digvijay/dev/CCKA-Clustered_Centroid_Kernel_Alignment/results/checkerboard
  lambda_kao:           [0.001]
  lambda_co:            [0.001]
  clusters:             [4]
  use_kmeans:           [False]
  decesion_boundary:    False


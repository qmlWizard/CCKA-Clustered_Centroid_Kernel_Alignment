[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccka"
version = "0.1.0"
description = "Clustered Centroid Kernel Alignment for Quantum and Classical Kernels"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

keywords = [
    "quantum-kernel",
    "kernel-alignment",
    "cka",
    "ccka",
    "pennylane",
    "jax",
    "qiskit",
    "quantum-machine-learning"
]

dependencies = [
    # Quantum
    "pennylane>=0.38,<0.41",
    "PennyLane-Lightning>=0.38,<0.41",
    "pennylane-qiskit>=0.38,<0.41",

    # JAX
    "jax>=0.4.30,<0.5",
    "jaxlib>=0.4.30,<0.5",

    # Scientific stack
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.6,<2",
    "pandas>=2.2,<3",

    # Visualization
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=6,<7",

    # Utilities
    "ray>=2.48,<3",
    "requests>=2.32,<3",
    "PyYAML>=6,<7",
    "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "black>=24",
    "ruff>=0.6",
    "ipykernel",
    "jupyterlab"
]

[tool.setuptools]
packages = ["ccka"]

[tool.setuptools.package-data]
ccka = ["**/*.json", "**/*.txt"]
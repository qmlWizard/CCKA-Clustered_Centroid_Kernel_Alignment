[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccka"
version = "0.1.0"
description = "Clustered Centroid Kernel Alignment for Quantum and Classical Kernels"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

keywords = [
    "quantum-kernel",
    "kernel-alignment",
    "cka",
    "ccka",
    "pennylane",
    "jax",
    "qiskit",
    "quantum-machine-learning"
]

dependencies = [
    "pennylane==0.38.0",
    "PennyLane-Lightning==0.38.0",

    "jax==0.4.14",
    "jaxlib==0.4.14",

    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",

    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "pandas==2.3.1",

    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "plotly==6.2.0",

    "ray==2.48.0",
    "requests==2.32.4",
    "PyYAML==6.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
    "jupyterlab"
]

[tool.setuptools]
packages = ["ccka"]

[tool.setuptools.package-data]
ccka = ["**/*.json", "**/*.txt"]

datasets:
  - qsar_biodegradation


training:
  epochs: 100
  min_n_qubits: 6
  reps: 5
  centroids: [6]
  inference_landmarks: 32
  inference_method: svm
  inference_neighbors: 1
  quackKTA_inference_method: svm
  ccka_inference_method: svm
  validation_fraction: 0.5
  feature_range: [-3.142, 3.142]
  collect_diagnostics: false
  learning_rate: 0.1
  centroid_lr: 0.01
  sub_centroid_lr: 0.01
  lambda_kao: 0.001
  lambda_co: 0.001
  co_margin: 0.1
  co_temperature: 0.1
  svm_c: 1.0

seeds: [0]

noise:
  types: [none]
  levels: [0.01]
  shots: [256]

experiments:
  methods: [fullKTA, randomKTA, quackKTA, ccka]
  ccka_initializations: [regular]
  ccka_inference_landmarks: [32]
  include_single_centroid_baseline: false
  ccka_ablations: {}

output_csv: results/real_world_centroid_sweep.csv
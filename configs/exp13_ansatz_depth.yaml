# Section 9: ansatz x depth x method grid (accuracy, parameter count, executions).
base: base.yaml
exp_name: exp13_ansatz_benchmark

ray:
  address: auto            # auto | local | host:port   (CLI --address overrides)
  working_dir: .           # only used when connecting to a remote address
  num_cpus_per_trial: null # null = all CPUs on each node, one trial per node
  num_gpus_per_trial: 0
  max_retries: 2           # retry Ray tasks lost to worker/node failures
  max_job_attempts: 2      # retry experiment-level errors once
  max_in_flight: null      # null = one pending task per available slot
  # expected_nodes, startup_timeout, port, num_cpus_per_node, local_num_cpus also accepted

datasets: [corners, checkerboard]

ansatze: [crz_ring, hardware_efficient, iqp, zz_feature_map, strongly_entangling, separable]

search_space:
  reps: [1, 2, 4, 6, 8]

seeds: [0, 1, 2]

experiments:
  methods: [fullKTA, randomKTA, quackKTA, ccka]
  ablation_datasets: []

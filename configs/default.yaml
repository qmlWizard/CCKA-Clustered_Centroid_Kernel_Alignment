datasets: [checkerboard, corners]

training:
  epochs: 200
  min_n_qubits: 5
  reps: 6
  centroids: [2, 4, 6, 8, 10]
  # CCKA Nyström landmark count for evaluation; use "all" for exact kernels.
  inference_landmarks: 32
  inference_method: svm
  inference_neighbors: 1
  quackKTA_inference_method: svm
  ccka_inference_method: svm
  validation_fraction: 0.5
  feature_range: [-0.1, 0.1]
  collect_diagnostics: false
  learning_rate: 0.1
  centroid_lr: 0.01
  sub_centroid_lr: 0.01
  lambda_kao: 0.01
  lambda_co: 0.01
  co_margin: 0.1
  co_temperature: 0.1
  svm_c: 1.0

seeds: [0, 1, 2]

noise:
  types: [none]
  levels: [0]
  shots: [1024]

experiments:
  methods: [fullKTA, randomKTA, quackKTA, ccka]
  ccka_initializations: [regular]
  ccka_inference_landmarks: [16, 32]
  ccka_ablations:
    main_only:
      centroids: 1
      update_kao: false
      update_co: true
    sub_only:
      centroids: 1
      update_kao: true
      update_co: false
    no_kao:
      update_kao: false
      update_co: true
    no_co:
      update_kao: true
      update_co: false

output_csv: results/experiments.csv

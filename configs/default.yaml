datasets: [checkerboard, corners, donuts, adult, one_vs_nonone, zero_vs_nonzero, pfault]

training:
  epochs: 1000
  min_n_qubits: 5
  reps: 4
  centroids: [2, 4, 8, 10, 12]
  random_samples: 8
  # CCKA Nyström landmark count for evaluation; use "all" for exact kernels.
  inference_landmarks: 32
  inference_method: svm
  inference_neighbors: 1
  quackKTA_inference_method: svm
  ccka_inference_method: svm
  validation_fraction: 0.2
  test_fraction: 0.5
  feature_range: [-3.142, 3,142]
  collect_diagnostics: false
  learning_rate: 0.05
  centroid_lr: 0.01
  sub_centroid_lr: 0.01
  lambda_kao: 0.001
  lambda_co: 0.001
  co_margin: 0.1
  co_temperature: 0.1
  svm_c: 1.0

seeds: [0, 1, 2, 3, 4]

noise:
  types: [none, coherent, depolarising]
  levels: [0.01, 0.02, 0.05, 0.07, 0.1]
  shots: [256, 1024, 2048, 4096]

experiments:
  methods: [fullKTA, randomKTA, quackKTA, ccka]
  ccka_initializations: [regular, kmeans]
  ccka_inference_landmarks: [8, 16, 32, all]
  ccka_ablations:
    main_only:
      centroids: 1
      update_kao: false
      update_co: true
    sub_only:
      centroids: 1
      update_kao: true
      update_co: false
    no_kao:
      update_kao: false
      update_co: true
    no_co:
      update_kao: true
      update_co: false

output_csv: results/experiments.csv

##Configurations for training the quntum kernel alignment

ray_config:
  ray_local_mode:         False
  num_cpus:               4
  num_gpus:               0
  method:                 QuantumKernels
  ray_logging_path:       double_cake
  ray_num_trial_samples:  1
  type:                   train
  ray_iteration:          1

## DataSet Configuration
dataset:
  name:              double_cake
  file:              None
  n_samples:         [20]
  noise:             0.5
  num_sectors:       [2, 3, 5, 10]
  points_per_sector: [10, 30, 50]
  grid_size:         4
  sampling_radius:   0.1
  training_size:     0.50
  testing_size:      0.50
  validation_size:   0.0

## Quantum Kernel Model Configuration
qkernel:
  device:           lightning.qubit
  n_qubits:         [4]
  trainable:        True
  input_scaling:    True
  data_reuploading: True
  ansatz:           ['embedding_paper']
  ansatz_layers:    [5]
  noisy:            False
  noise_level:      [0.01]

## Model Training Agent Configuration
agent:
  optimizer:            ['gd', 'adam']
  lr:                   [0.1, 0.2]
  mclr:                 [0.01]
  cclr:                 [0.01]
  epochs:               [100]
  train_method:         ['ccka']
  target_accuracy:      0.95
  get_alignment_every:  1
  validate_every_epoch: 1
  base_path:            results/checkerboard 
  lambda_kao:           [0.001]
  lambda_co:            [0.001]
  clusters:             [2, 4, 6, 8, 10]
  use_kmeans:           [False, True]
  decesion_boundary:    False
